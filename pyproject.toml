[project]
name = "job-agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "skumarudel", email = "skumarudel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "selenium>=4.46.0",
]

[project.scripts]
job-agent-lab = "job_agent_lab:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "types-beautifulsoup4>=4.12.0.20250516",
]
